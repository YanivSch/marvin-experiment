<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הניסוי של מרווין: האם הסבר של AI עוזר לנו להחליט?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9ECF5; --card:#fff; --ink:#1A1D3A; --muted:#5C6185;
  --pos:#0E8A7D; --pos-bg:#D3F0EB; --neg:#BF2F68; --neg-bg:#F9D9E5;
  --marvin:#E9A823; --marvin-bg:#FFF4D6; --line:#CDD2E4;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:Rubik,system-ui,sans-serif;font-size:17px;line-height:1.55}
header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header b{font-weight:800;font-size:18px}
header a{color:#fff;font-size:14px;opacity:.85}
main{max-width:660px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:clamp(30px,7vw,46px);line-height:1.12;font-weight:800;margin:18px 0 14px;letter-spacing:-.01em}
h2{font-size:24px;line-height:1.2;font-weight:800;margin:34px 0 10px}
h3{font-size:18px;margin:0 0 6px;font-weight:700}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:14.5px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:focus-visible,a:focus-visible{outline:3px solid var(--marvin);outline-offset:2px}
.primary{background:var(--ink);color:#fff;padding:15px 24px;font-weight:700;font-size:18px;width:100%}
.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);padding:11px 18px;font-weight:500}
.steps{padding:0;margin:16px 0 22px;list-style:none;counter-reset:s}
.steps li{counter-increment:s;padding:10px 46px 10px 0;position:relative;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;right:0;top:9px;width:30px;height:30px;border-radius:50%;background:var(--marvin);font-weight:800;display:grid;place-items:center}

.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .3s}
.phase{display:flex;justify-content:space-between;font-size:14.5px;color:var(--muted);margin-bottom:14px}
.review{background:var(--card);border-radius:14px;padding:22px 20px;font-family:"Frank Ruhl Libre",serif;font-size:19px;line-height:1.7;min-height:150px}
.review mark{background:none;color:inherit;border-radius:4px;padding:1px 3px}
.review mark.pos.on{background:var(--pos-bg);box-shadow:inset 0 -2px 0 var(--pos)}
.review mark.neg.on{background:var(--neg-bg);box-shadow:inset 0 -2px 0 var(--neg)}
.marvin{margin-top:12px;background:var(--marvin-bg);border-right:6px solid var(--marvin);border-radius:4px 14px 14px 4px;padding:14px 16px}
.marvin .say{font-weight:700;font-size:18px}
.marvin .say span.pos{color:var(--pos)} .marvin .say span.neg{color:var(--neg)}
.conf{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:15px}
.conf .bar{flex:1;height:10px;background:#fff;border-radius:5px;overflow:hidden}
.conf .bar i{display:block;height:100%;background:var(--marvin);width:0;transition:width .6s ease-out}
.legend{font-size:14px;margin-top:8px;color:var(--muted)}
.legend b.pos{color:var(--pos)} .legend b.neg{color:var(--neg)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.choices button{padding:18px 8px;font-size:19px;font-weight:700;color:#fff}
.choices .pos{background:var(--pos)} .choices .neg{background:var(--neg)}
.choices button:disabled{opacity:.35;cursor:default}
.primary:disabled{opacity:.55;cursor:default}
.verdict{margin-top:14px;padding:13px 16px;border-radius:12px;font-weight:500;background:var(--card);border:2px solid var(--ink)}
.verdict button{margin-top:10px}

.reveal{background:var(--ink);color:#fff;border-radius:14px;padding:20px;margin:14px 0}
.reveal .muted{color:#B9BEDD}
.chart{margin:14px 0 6px}
.row{display:grid;grid-template-columns:140px 1fr 48px;align-items:center;gap:10px;margin:9px 0;font-size:15.5px}
.track{height:26px;background:#fff;border-radius:6px;position:relative;overflow:hidden}
.track i{position:absolute;inset:0 0 0 auto;border-radius:6px}
.track .zone{position:absolute;top:0;bottom:0;left:0;background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(14,138,125,.28) 5px 10px);border-right:2px dashed var(--pos)}
.num{font-weight:800;text-align:left;direction:ltr}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.stat{background:var(--card);border-radius:14px;padding:16px}
.stat .big{font-size:40px;font-weight:800;line-height:1;direction:ltr;text-align:right}
.stat.warn{background:var(--neg-bg)} .stat.warn .big{color:var(--neg)}
.note{background:var(--card);border-radius:14px;padding:18px;margin:12px 0}
ol.q{padding-right:22px;margin:8px 0} ol.q li{margin-bottom:8px}
.code{font-family:ui-monospace,Menlo,monospace;direction:ltr;text-align:center;font-size:24px;font-weight:700;background:var(--paper);border-radius:10px;padding:12px;margin:8px 0 12px;user-select:all}
textarea{width:100%;font:15px ui-monospace,Menlo,monospace;padding:12px;border:2px solid var(--ink);border-radius:10px;background:#fff}
.tally{background:var(--card);border-radius:14px;padding:16px;margin:12px 0}
.counter{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
.counter div{display:flex;align-items:center;gap:10px}
.counter button{width:44px;height:44px;font-size:24px;font-weight:700;background:var(--paper);color:var(--ink)}
.counter output{min-width:34px;text-align:center;font-weight:800;font-size:22px}
@media (max-width:420px){.row{grid-template-columns:108px 1fr 44px;font-size:14px}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.job{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px;font-size:15px;line-height:1.45}
.job h3{font-size:16px;margin:0 0 6px}
.job .lbl{font-weight:700;font-size:13.5px;color:var(--muted);margin-top:6px}
.job ul{margin:2px 0 0;padding-right:20px}
.job .adv{color:var(--muted)}
.why{display:block;margin-top:6px;font-weight:400;font-size:15.5px}
.rule{background:var(--marvin-bg);border-right:6px solid var(--marvin);border-radius:4px 14px 14px 4px;padding:14px 16px;margin:14px 0}
.tag{display:inline-block;background:var(--marvin);color:var(--ink);font-weight:800;font-size:14px;border-radius:20px;padding:3px 12px;margin-top:14px}
</style>
</head>
<body>
<header><b>הניסוי של מרווין</b></header>
<main id="app"></main>

<script>
/* ---------- תוכן הניסוי ---------- */
// [+...+] נתון שתומך בתשובה "חיובית"/"לקבל", [-...-] נתון שתומך ב"שלילית"/"לדחות".
// t = התשובה הנכונה, ai = ההמלצה של מרווין, c = ביטחון, j = המשרה, w = הסבר שמוצג אחרי התשובה.
const JOBS = {

     adv:["תואר בהנדסה או במדעי המחשב","הסמכת PMP","ניסיון בעבודה מול ספקים חיצוניים"]}
};

const REVIEWS_SOLO = [
 {x:"קניתי את מכונת הקפה אחרי חודשים של התלבטות, בעיקר בגלל המחיר. אני עדיין חושב שהיא יקרה מדי ביחס למה שמקבלים בקופסה: אין מטחנה, אין מקציף נפרד, והכוס שמגיעה איתה נראית כמו פלסטיק של פיקניק. אבל כל בוקר, כשאני מקבל אספרסו עם קרמה עבה ואחידה תוך פחות מדקה, אני שוכח מהקבלה. הניקוי לוקח שתי דקות, והיא לא זזה מהשיש כבר שמונה חודשים. אם הייתי צריך להחליט שוב, הייתי קונה אותה שוב, רק מחכה למבצע.", t:"pos"},
 {x:"התחלה מבטיחה: החדר היה נקי ומואר, המיטה נוחה, והנוף לים בדיוק כמו בתמונות. פקידת הקבלה אפילו הציעה לנו שדרוג חינם. רק שבלילה הראשון התברר שמתחת לחלון יש בר שמנגן עד שלוש לפנות בוקר, ושהמזגן מטפטף על הרצפה. ביקשנו להחליף חדר ושמענו שהמלון מלא. בבוקר ארוחת הבוקר נגמרה בתשע וחצי, ואנחנו הגענו בתשע ועשרים. שלושה לילות בלי שינה, במחיר של מלון חמישה כוכבים. בפעם הבאה נעדיף צימר.", t:"neg"},
 {x:"לקחתי את הילדים לסדנת קרמיקה בלי ציפיות, בעיקר כדי להעביר שבת גשומה. המדריכה הסבירה בסבלנות לכל ילד בנפרד, נתנה לקטן שלי להתלכלך כמה שרצה ולא העירה כשהפיל כלי שלם על הרצפה. אחרי שעתיים יצאנו עם שלוש קערות עקומות ומלאות גאווה. החניה בסביבה היא סיוט, ואת הכלים אוספים רק אחרי שבועיים, כשהם יוצאים מהתנור. ובכל זאת, הילדים כבר שואלים מתי חוזרים, ורשמתי אותם לסדנה הבאה.", t:"pos"}
];
const REVIEWS_TEAM = [
 {x:"[-אכזבה גדולה-]. הזמנו את הסוויטה כדי לחגוג יום נישואים, ובמקום [-אמבטיה עם נוף לים-] קיבלנו חדר שהחלון שלו פונה לחניון. [-ריח של טחב-] הורגש כבר בכניסה, ובבוקר השני [-לא היו מים חמים-] במקלחת. הצוות [+היה אדיב+] ו[+הביא לנו בקבוק יין+] כפיצוי, אבל כשביקשנו החזר על ההפרש שמענו ש[-זו המדיניות-]. על 2,400 שקל ללילה [-ציפינו להרבה יותר-]. [-לא נחזור-], וגם לא נמליץ לחברים.", t:"neg", ai:"neg", c:92},
 {x:"הזמנו ארון הזזה לחדר השינה, וכל מה שקשור לחברה עצמה היה [-מתיש-]. המשלוח [-נדחה פעמיים-], השליח [-הגיע בלי כלים-], ובחוברת ההרכבה [-היה חסר עמוד שלם-]. בשלב מסוים בעלי כבר [-רצה להחזיר הכול-]. בסוף המוקד שלח טכנאי על חשבונם, ורק אז התברר ש[+הארון עצמו מעולה+]: [+הדלתות מחליקות בשקט+], המדפים יציבים, ונכנס בו הרבה יותר ממה שחשבנו. עברה חצי שנה, [+אני לא מתחרטת לרגע+] ו[+אזמין מהם שוב+].", t:"pos", ai:"neg", c:86},
 {x:"יש לי [-רגשות מעורבים-] לגבי הקורס המקוון באקסל. [-הסרטונים ארוכים מדי-], המרצה [-חוזר על עצמו-], והפורום של הקורס [-כמעט מת-], כך שעל השאלות שלי עניתי לבד. מצד שני, התרגילים [+בנויים על נתונים אמיתיים+] ממקומות עבודה, ובפרק על טבלאות ציר [+סוף סוף הבנתי+] משהו שניסיתי ללמוד שנים. כבר בשבוע שעבר [+חסכתי לעצמי יום עבודה+] בדוח החודשי. במחיר ששילמתי, [+התמורה הייתה שווה את זה+].", t:"pos", ai:"pos", c:64},
 {x:"[+איזה כיף+] שיש מסעדות שמלמדות אותך סבלנות. [-חיכינו ארבעים דקות-] לשולחן שהזמנו מראש, ועוד עשרים לתפריט. המלצרית [+הייתה באמת חמודה+] והתנצלה כל הזמן, ו[+הלחם בהתחלה היה טעים+]. [-הסטייק הגיע פושר-], אבל [+החשבון הגיע מהר מאוד+], דווקא. [-ב־480 שקל לזוג מצפים ליותר-]. אולי נחזור [-כשיפתחו סניף שמכבד את הזמן של אנשים-].", t:"neg", ai:"pos", c:68},
 {x:"חששתי מהשיפוץ, אחרי סיפורי האימה של השכנים. [+הקבלן הגיע בזמן כל בוקר+], [+השאיר את הדירה נקייה+] בסוף כל יום, ו[+עמד במחיר שסיכמנו+] גם כשגילה צנרת רקובה מתחת לריצוף. נכון, [-העבודה התארכה בשבוע-] בגלל ספק אריחים, ו[-הרעש בשבע בבוקר לא היה תענוג-]. אבל המטבח החדש [+נראה בדיוק כמו בהדמיה+], וכל תקלה קטנה שגילינו אחר כך [+תוקנה תוך יומיים+]. [+כבר המלצתי עליו לשלושה חברים+].", t:"pos", ai:"pos", c:88},
 {x:"היה [+בסדר+], באמת. [+הטיסה המריאה בזמן+], [+המושבים נוחים יחסית+], והדיילים [+חייכו+]. אבל [-המזוודה שלי לא הגיעה-] לאתונה, ושלושה ימים [-הסתובבתי בבגדים של אחי-]. במוקד [-העבירו אותי בין ארבעה נציגים-], ואף אחד [-לא ידע להגיד איפה היא-]. כשהיא הגיעה לבסוף, [-הידית הייתה שבורה-], והפיצוי שהוצע היה [-שובר של 50 יורו-] לטיסה הבאה. את הטיסה הבאה [-אזמין בחברה אחרת-].", t:"neg", ai:"neg", c:71},
 {x:"קנינו את הטאבלט לבן שלנו לקראת שנת הלימודים. [-כבר בשבוע הראשון-] הסוללה [-התרוקנה תוך שלוש שעות-], והמסך [-הפסיק להגיב למגע-] בצד שמאל. במעבדה [-החזיקו אותו שלושה שבועות-] והחזירו אותו [-עם אותה תקלה בדיוק-]. [+המוכר בחנות ניסה לעזור+], אבל ידיו היו כבולות. בסוף [-ויתרנו וקנינו מותג אחר-], ואת הטאבלט [-הזה אני לא ממליצה לאף אחד-].", t:"neg", ai:"neg", c:95}
];

const CANDS_SOLO = [
 {j:"A", t:"pos", x:"מיכל, 34. בעלת תואר ראשון בחשבונאות וכלכלה מאוניברסיטת בר־אילן. חמש שנים עבדה כאנליסטית במחלקת הכספים של רשת קמעונאות, שם הכינה תחזיות תזרים ובנתה מודלים ב־Excel לבדיקת כדאיות של סניפים חדשים. בשנה האחרונה היא חתמת אשראי בחברת מימון ובודקת בקשות הלוואה של עסקים קטנים. האנגלית שלה טובה, ואין לה ניסיון בתכנות. היא מחפשת ארגון גדול ומסודר יותר, עם מסלול קידום ברור.",
  w:"היא עומדת בשלוש דרישות החובה: תואר בחשבונאות ובכלכלה, שש שנות ניסיון בניתוח פיננסי ובחיתום, ושליטה גבוהה ב־Excel."},
 {j:"B", t:"neg", x:"אורי, 38. מהנדס תוכנה בהכשרתו, בעל הסמכת PMP. בשש השנים האחרונות הוא מנהל פרויקטים בחברת אינטגרציה. הוא הוביל הטמעה של מערכת CRM בשלוש חברות ביטוח ועבד צמוד מול ספקים מחו״ל, וכל הפרויקטים נמסרו בזמן ובתקציב. הצוות הקבוע שלו כולל שני מפתחים ובודקת תוכנה, ובשאר המשימות הוא נעזר בספקים חיצוניים. עברית ואנגלית ברמת שפת אם. הממליץ שלו כתב: \"מנהל הפרויקטים המסודר ביותר שהכרתי\".",
  w:"חסרה לו דרישת חובה: הצוות שהוביל מונה שלושה אנשים, והמשרה דורשת חמישה לפחות. כל היתרונות שלו לא משנים את זה."},
 {j:"A", t:"neg", x:"יוסי, 41. בעל תואר ראשון בהיסטוריה ובמדע המדינה מהאוניברסיטה העברית. כבר שבע שנים הוא חתם אשראי בחברת משכנתאות: מנתח דוחות כספיים ותלושי שכר ומכין המלצות לוועדת האשראי. הוא בנה ב־Excel כלי לבדיקת כושר ההחזר החודשי שכל המחלקה משתמשת בו, ולמד SQL בקורס ערב. האנגלית שלו טובה מאוד. הוא רוצה לעבור לתחום העסקים הקטנים כדי לעסוק בניתוחים מורכבים יותר.",
  w:"חסרה לו דרישת חובה: התואר שלו בהיסטוריה ובמדע המדינה, לא בכלכלה, בניהול, בחשבונאות או בתחום כמותי. הניסיון העשיר לא מחליף את דרישת התואר."}
];
const CANDS_TEAM = [
 {j:"A", t:"neg", ai:"neg", c:90, x:"גל, 30. [-לא סיים תואר-]: [-עזב את לימודי הכלכלה-] אחרי שנה כדי להקים עסק משלו. [+כבר שבע שנים הוא אנליסט פיננסי+] בחברת ייעוץ לעסקים קטנים, [+מנתח דוחות ותזרימים+] ומכין ללקוחות בקשות אשראי מול גופי מימון. הוא [+בונה מודלים מורכבים ב־Excel+] ו[+כותב Python+] כדי להפוך דוחות לאוטומטיים. [+האנגלית שלו ברמה גבוהה+]. בראיון הטלפוני הוא הרשים בהבנה עמוקה של עולם העסקים הקטנים.",
  w:"חסרה לו דרישת חובה: אין לו תואר ראשון. הניסיון והכישורים שלו מרשימים, אבל לפי הכלל אי אפשר לקבל אותו."},
 {j:"A", t:"neg", ai:"pos", c:91, x:"דניאל, 31. [+בוגר כלכלה וניהול בהצטיינות+] מהאוניברסיטה העברית. [-בשנתיים האחרונות-] הוא אנליסט בקרן הון סיכון, ובנה שם [+מודל Excel לתמחור סבבי גיוס+] שכל הצוות אימץ. לפני כן [-עבד שנה כרכז מכירות-] בסטארט־אפ. הוא [+כותב Python ו־SQL+] ומעביר בהתנדבות [+סדנת Excel מתקדם+]. [+אנגלית שפת אם+]. ממליצה כתבה עליו: [+\"האנליסט החד ביותר שעבד איתי\"+].",
  w:"חסרה לו דרישת חובה: יש לו רק שנתיים של ניתוח פיננסי. השנה כרכז מכירות לא נחשבת."},
 {j:"B", t:"pos", ai:"pos", c:70, x:"שירה, 45. [-עשר שנים הייתה מורה לאנגלית-], ו[-אין לה תואר טכנולוגי-]. [+לפני חמש שנים עברה לתחום+]: [+ארבע שנים וחצי היא מנהלת פרויקטים+] באגף מערכות המידע של עירייה גדולה, והובילה את [+המעבר של 40 מחלקות למערכת דיגיטלית+]. היא [+מנהלת צוות של שישה+] אנשי מערכות ומתאמת מול [+שלושה ספקים חיצוניים+]. [+עברית ואנגלית ברמה גבוהה מאוד+]. [-אין לה הסמכת PMP-].",
  w:"היא עומדת בכל דרישות החובה: ארבע שנים וחצי בניהול פרויקטים טכנולוגיים, צוות של שישה, ושתי השפות ברמה גבוהה מאוד. תואר והסמכה הם רק יתרון."},
 {j:"A", t:"pos", ai:"neg", c:66, x:"רונית, 44. [+תואר ראשון במנהל עסקים+] מהאוניברסיטה הפתוחה. [+בין 2010 ל־2014 עבדה כחתמת אשראי+] בחברת ליסינג. אחר כך [-הייתה הפסקה של שש שנים-], שבהן גידלה את ילדיה וטיפלה בהורה. מאז 2021 היא [-מנהלת חשבונות במשרד קטן-] ו[+בונה ב־Excel תזרימי מזומנים ודוחות+] ללקוחות עסקיים. [-אין לה ניסיון בחברה פיננסית גדולה-] ו[-היא לא כותבת קוד-]. האנגלית שלה טובה.",
  w:"היא עומדת בכל דרישות החובה: תואר במנהל עסקים, ארבע שנות חיתום אשראי ושליטה גבוהה ב־Excel. הפער בקורות החיים והיתרונות החסרים אינם חלק מהדרישות."},
 {j:"B", t:"pos", ai:"pos", c:85, x:"עמית, 36. [-לא למד באוניברסיטה-]: [+התחיל כטכנאי מחשבים בצבא+] והתקדם משם. [+שש שנים הוא מנהל פרויקטים+] בחברת סייבר, [+מוביל צוות של שמונה+] מפתחים ובודקים, ו[+מסר בזמן הטמעה של מערכת אבטחה+] בשני בתי חולים. הוא [+עובד מול ספקים מארה״ב ומהודו+]. [+עברית ואנגלית ברמה גבוהה מאוד+], כולל כתיבת מסמכי דרישות באנגלית. [+בעל הסמכת PMP+].",
  w:"הוא עומד בכל דרישות החובה. במשרה הזו תואר הוא רק יתרון, לא חובה."},
 {j:"B", t:"neg", ai:"neg", c:62, x:"ולדימיר, 50. [+מהנדס חשמל+] [+עם הסמכת PMP+]. [+כבר 12 שנה הוא מנהל פרויקטים+] של מערכות מידע בחברת תשתיות, [+מוביל צוותים של עד 15 אנשים+] ו[+עובד מול ספקים מאירופה+]. [+העברית שלו טובה מאוד+], אבל [-האנגלית שלו בסיסית-], ו[-את המסמכים באנגלית כותב בשבילו עמית-] מהצוות. [+הפרויקטים שלו ידועים כיציבים+] וכמעט אף פעם לא חורגים מהתקציב.",
  w:"חסרה לו דרישת חובה: האנגלית שלו בסיסית, והמשרה דורשת אנגלית ברמה גבוהה מאוד, בכתב ובעל פה."},
 {j:"A", t:"pos", ai:"pos", c:94, x:"נועה, 33. [+תואר ראשון בסטטיסטיקה+] ו[+תואר שני במימון+] מאוניברסיטת תל אביב. [+חמש שנים היא אנליסטית אשראי+] בחברת אשראי גדולה, במחלקה שמלווה עסקים בינוניים, ו[+בנתה ב־Excel וב־SQL+] את דוח הסיכונים החודשי של המחלקה. [+האנגלית שלה ברמה גבוהה+]. היא [-מבקשת שכר גבוה בכ־15%-] מהטווח שפורסם, ו[-תהיה זמינה רק בעוד שלושה חודשים-].",
  w:"היא עומדת בכל דרישות החובה. השכר והזמינות אינם חלק מהכלל."}
];

const ITEMS = [
  ...REVIEWS_SOLO.map(o=>({...o,k:"rev",solo:true})),
  ...REVIEWS_TEAM.map(o=>({...o,k:"rev",solo:false})),
  ...CANDS_SOLO.map(o=>({...o,k:"cand",solo:true})),
  ...CANDS_TEAM.map(o=>({...o,k:"cand",solo:false}))
];
const SOLO_ITEMS = ITEMS.filter(i=>i.solo), TEAM_ITEMS = ITEMS.filter(i=>!i.solo);
const SECTION_AT = {0:"rev", [REVIEWS_SOLO.length+REVIEWS_TEAM.length]:"cand"};

const THRESHOLD = 80; // מתחת לסף הזה ההסבר האדפטיבי מציג את שני הצדדים
const CONDS = {
  conf:{name:"ביטחון בלבד", desc:"ראיתם את ההמלצה של מרווין ואת רמת הביטחון שלו, בלי שום הסבר."},
  top1:{name:"הסבר להמלצה", desc:"מרווין סימן בטקסט את מה שתומך בהמלצה שלו, ורק את זה."},
  adapt:{name:"הסבר אדפטיבי", desc:"כשמרווין היה בטוח (מעל "+THRESHOLD+"%) הוא סימן רק את מה שתומך בהמלצה. כשלא היה בטוח, הוא סימן גם את הטיעונים לצד השני."}
};
const LBL = {rev:{pos:"חיובית", neg:"שלילית"}, cand:{pos:"לקבל", neg:"לדחות"}};
const LETTER = {conf:"C", top1:"E", adapt:"A"};
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwUzo2U8YDiKNB8abNtQK_Eu7cPN4w-n7zlg15_86dtgA35QXARrqDfLq3vJF4VfPFyAw/exec";
const AI_ACC = TEAM_ITEMS.filter(i=>i.ai===i.t).length / TEAM_ITEMS.length;
const RULE = "מועמד שעומד בכל דרישות החובה עובר לשלב הבא. מועמד שחסרה לו אפילו דרישת חובה אחת נדחה. יתרונות, רושם כללי ופרטים שלא מופיעים בדרישות לא משנים את ההחלטה.";

/* ---------- מצב ---------- */
let S = fresh();
function fresh(cond){
  const keys = Object.keys(CONDS);
  return {cond: cond || keys[Math.floor(Math.random()*keys.length)], i:0, ans:[], seen:{}, stage:"intro", sent:false};
}
const app = document.getElementById("app");
const pct = n => Math.round(n*100)+"%";

/* ---------- תצוגות ---------- */
function render(){
  if (S.stage==="play" && SECTION_AT[S.i] && !S.seen[S.i]) return section(SECTION_AT[S.i]);
  ({intro, play, results})[S.stage]();
  window.scrollTo(0,0);
}

function intro(){
  app.innerHTML = `
  <h1>מרווין הוא AI שעוזר לקבל החלטות. תסמכו עליו?</h1>
  <p>ברבע השעה הקרובה אתם הנבדקים בניסוי קטן שמשחזר מאמר מ־CHI 2021. יש שתי משימות, ובכל אחת עשר החלטות:</p>
  <ol class="steps">
    <li><b>ביקורות:</b> לקרוא ביקורת ולהחליט אם מי שכתב אותה יצא מרוצה או מאוכזב.</li>
    <li><b>גיוס:</b> לקרוא פרופיל של מועמד ולהחליט אם לקבל אותו למשרה, לפי דרישות התפקיד.</li>
    <li>בכל משימה 3 החלטות לבד, ואז 7 החלטות עם מרווין. הוא ממליץ, אתם מחליטים.</li>
  </ol>
  <p class="muted small">מרווין טוב, אבל לא מושלם. כל אחד בכיתה מקבל גרסה קצת אחרת שלו, אז אל תציצו למסך של השכנים.</p>
  <button class="primary" id="go">להתחיל</button>`;
  document.getElementById("go").onclick = ()=>{ S.stage="play"; render(); };
}

function jobCard(j){
  const J = JOBS[j];
  return `<div class="job"><h3>המשרה: ${J.title}</h3>
    <div class="lbl">דרישות חובה</div><ul>${J.must.map(m=>`<li>${m}</li>`).join("")}</ul>
    <div class="lbl">יתרון (לא מכריע)</div><ul class="adv">${J.adv.map(m=>`<li>${m}</li>`).join("")}</ul></div>`;
}

function section(k){
  app.innerHTML = k==="rev" ? `
    <span class="tag">משימה 1 מתוך 2</span>
    <h1>ביקורות</h1>
    <p>תקראו כל ביקורת עד הסוף ותחליטו: האם הכותב יצא מהחוויה מרוצה (חיובית) או מאוכזב (שלילית)?</p>
    <p class="muted small">שימו לב: יש ביקורות שמתלוננות הרבה ובכל זאת ממליצות, ויש כאלה שמחמיאות ובכל זאת לא.</p>
    <button class="primary" id="go">לביקורת הראשונה</button>` : `
    <span class="tag">משימה 2 מתוך 2</span>
    <h1>גיוס</h1>
    <p>החברה מגייסת לשתי משרות. בכל שאלה תראו את דרישות המשרה ופרופיל של מועמד, ותחליטו אם לקבל אותו לשלב הבא.</p>
    <div class="rule"><b>הכלל של החברה:</b> ${RULE}</div>
    <p class="muted small">גם כאן: 3 מועמדים לבד, ואז 7 עם מרווין.</p>
    <button class="primary" id="go">למועמד הראשון</button>`;
  document.getElementById("go").onclick = ()=>{ S.seen[S.i]=true; render(); };
  window.scrollTo(0,0);
}

function markup(text, mode, pred){
  return text.replace(/\[([+-])(.+?)[+-]\]/g, (_,sign,body)=>{
    const cls = sign==="+" ? "pos" : "neg";
    const on = mode==="both" || (mode==="one" && cls===pred);
    return `<mark class="${cls}${on?" on":""}">${body}</mark>`;
  });
}

function play(){
  const item = ITEMS[S.i], total = ITEMS.length, L = LBL[item.k];
  const cand = item.k==="cand";
  let mode = "none";
  if (!item.solo){
    if (S.cond==="top1") mode="one";
    if (S.cond==="adapt") mode = item.c >= THRESHOLD ? "one" : "both";
  }
  const what = cand ? "נתונים" : "טיעונים";
  const legend = mode==="one"
      ? (cand ? `מרווין סימן את מה ששכנע אותו <b class="${item.ai}">${L[item.ai]}</b>.`
              : `מרווין סימן את מה ששכנע אותו שהביקורת <b class="${item.ai}">${L[item.ai]}</b>.`)
      : mode==="both" ? `מרווין לא בטוח, אז הוא סימן ${what} <b class="pos">בעד</b> וגם <b class="neg">נגד</b>.` : "";
  const say = cand ? `מרווין: ההמלצה שלי היא <span class="${item.ai}">${L[item.ai]}</span>`
                   : `מרווין: נראה לי שהביקורת <span class="${item.ai}">${L[item.ai]}</span>`;
  const task = cand ? "גיוס" : "ביקורות";
  app.innerHTML = `
  <div class="progress"><i style="width:${S.i/total*100}%"></i></div>
  <div class="phase"><span>${task} · ${item.solo?"לבד":"עם מרווין"}</span><span>${S.i+1} מתוך ${total}</span></div>
  ${cand ? jobCard(item.j) : ""}
  <div class="review">${markup(item.x, mode, item.ai)}</div>
  ${item.solo?"":`<div class="marvin">
     <div class="say">${say}</div>
     <div class="conf"><span>ביטחון</span><div class="bar"><i id="cbar"></i></div><b>${item.c}%</b></div>
     ${legend?`<div class="legend">${legend}</div>`:""}
   </div>`}
  <div class="choices">
    <button class="pos" data-a="pos">${L.pos}</button>
    <button class="neg" data-a="neg">${L.neg}</button>
  </div>
  <div id="verdict" aria-live="polite"></div>`;
  if (!item.solo) requestAnimationFrame(()=>requestAnimationFrame(()=>{ const b=document.getElementById("cbar"); if(b) b.style.width=item.c+"%"; }));
  app.querySelectorAll(".choices button").forEach(b=> b.onclick = ()=>{
    const a = b.dataset.a, ok = a===item.t;
    S.ans[S.i] = a;
    app.querySelectorAll(".choices button").forEach(x=>x.disabled=true);
    let msg = ok ? "נכון." : (cand ? `לא הפעם. לפי הכלל, את המועמד הזה צריך ${L[item.t]}.` : `לא הפעם. הכותב דירג את החוויה כ${L[item.t]}.`);
    if (!item.solo && item.ai!==item.t) msg += ok ? " מרווין טעה כאן, ואתם לא הלכתם אחריו." : " גם מרווין טעה כאן.";
    if (item.w) msg += `<span class="why">${item.w}</span>`;
    const last = S.i===total-1;
    const nextLbl = last ? "לתוצאות" : (ITEMS[S.i+1].k==="cand" ? (cand ? "למועמד הבא" : "למשימה הבאה") : "לביקורת הבאה");
    document.getElementById("verdict").innerHTML = `<div class="verdict">${msg}<button class="primary" id="next">${nextLbl}</button></div>`;
    const n = document.getElementById("next");
    n.onclick = ()=>{ S.i++; if (S.i>=total) S.stage="results"; render(); };
    n.focus();
  });
}

function bar(label, v, color, zoneFrom){
  return `<div class="row"><span>${label}</span>
   <div class="track">${zoneFrom!=null?`<span class="zone" style="width:${(1-zoneFrom)*100}%"></span>`:""}<i style="width:${v*100}%;background:${color}"></i></div>
   <span class="num">${pct(v)}</span></div>`;
}

function results(){
  const pairs = ITEMS.map((it,i)=>({it,a:S.ans[i]}));
  const soloP = pairs.filter(o=>o.it.solo), teamP = pairs.filter(o=>!o.it.solo);
  const soloN = soloP.filter(o=>o.a===o.it.t).length, teamN = teamP.filter(o=>o.a===o.it.t).length;
  const solo = soloN/soloP.length, team = teamN/teamP.length;
  const right = teamP.filter(o=>o.it.ai===o.it.t), wrong = teamP.filter(o=>o.it.ai!==o.it.t);
  const agreeRight = right.filter(o=>o.a===o.it.ai).length;
  const agreeWrong = wrong.filter(o=>o.a===o.it.ai).length;
  const best = Math.max(solo, AI_ACC);
  const verdict = team>best
    ? "הצוות עקף גם אתכם וגם את מרווין. זה בדיוק מה שהמאמר מכנה ביצועים משלימים."
    : team===best ? "הצוות השתווה לטוב מבין השניים, אבל לא עקף אותו. השלם עוד לא עולה על סך חלקיו."
    : "הצוות יצא פחות טוב מהשחקן החזק שבו. במצב כזה עדיף היה לתת לאחד מכם להחליט לבד.";
  const c = CONDS[S.cond];
  const code = ["MRV2", LETTER[S.cond], soloN, teamN, agreeRight, agreeWrong].join("-");
  app.innerHTML = `
  <h1>האם השלם עלה על סך חלקיו?</h1>
  <p class="small muted">שתי המשימות יחד: ${soloP.length} החלטות לבד ו־${teamP.length} החלטות עם מרווין.</p>
  <div class="chart">
    ${bar("אתם לבד", solo, "var(--ink)")}
    ${bar("מרווין לבד", AI_ACC, "var(--marvin)")}
    ${bar("אתם + מרווין", team, "var(--pos)", best)}
  </div>
  <p class="small muted">האזור המקווקו הוא האזור המשלים: דיוק גבוה יותר מזה של כל אחד מכם בנפרד. (${soloP.length} החלטות לבד הן מדגם קטן, אז קחו את השורה הראשונה בעירבון מוגבל.)</p>
  <p><b>${verdict}</b></p>

  <div class="two">
    <div class="stat"><div class="big">${agreeRight}/${right.length}</div><p class="small">פעמים שהסכמתם עם מרווין כשהוא צדק</p></div>
    <div class="stat warn"><div class="big">${agreeWrong}/${wrong.length}</div><p class="small">פעמים שהלכתם אחריו כשהוא טעה</p></div>
  </div>

  <div class="note" style="border:2px solid var(--ink)">
    <h3>שלחו את התוצאה שלכם לכיתה</h3>
    <p class="small">לחיצה אחת שולחת את הקוד למרצה. הקוד אנונימי: הוא כולל רק את הקבוצה שלכם וארבעה מספרים.</p>
    <div class="code" id="code">${code}</div>
    <button class="primary" id="send" ${S.sent?"disabled":""}>${S.sent?"התוצאה נשלחה":"לשלוח את התוצאה"}</button>
    <p class="small muted" id="sendmsg" aria-live="polite" style="margin:10px 0 0"></p>
    <button class="ghost" id="copy" style="margin-top:10px;width:100%">להעתיק את הקוד</button>
  </div>

  <div class="reveal">
    <p class="muted small">הקבוצה שלכם בניסוי</p>
    <h3 style="font-size:24px">${c.name}</h3>
    <p>${c.desc}</p>
    <p class="muted small" style="margin:0">שאר הכיתה חולקה באקראי לשלוש קבוצות: ביטחון בלבד, הסבר להמלצה, הסבר אדפטיבי.</p>
  </div>

  <h2>מה מצאו במאמר</h2>
  <p class="small muted">המאמר של Bansal ועמיתים, <bdi dir="ltr">“Does the Whole Exceed its Parts?”</bdi>, הוצג בכנס <bdi>CHI 2021</bdi> וכלל 1,626 משתתפים בשלוש משימות.</p>
  <div class="chart">
    ${bar("אדם לבד", .82, "var(--ink)")}
    ${bar("AI לבד", .84, "var(--marvin)")}
    ${bar("צוות + ביטחון", .89, "var(--pos)", .84)}
    ${bar("צוות + הסבר", .88, "var(--pos)", .84)}
  </div>
  <p class="small muted">דיוק ממוצע במשימת ביקורות הבירה.</p>
  <div class="note">
    <p><b>העזרה של ה־AI הועילה, ההסבר לא הוסיף.</b> הצוותים עקפו גם את האדם וגם את המודל, אבל הצגת הסבר לא שיפרה את הדיוק מעבר להצגת רמת הביטחון בלבד.</p>
    <p><b>הסבר משכנע, גם כשהוא שגוי.</b> ההסברים הגדילו את הסיכוי שאנשים יקבלו את ההמלצה, בלי קשר לשאלה אם היא נכונה. כשה־AI צדק זה עזר, כשטעה זה הזיק, והשינוי נטו היה זניח.</p>
    <p style="margin:0"><b>הסבר אדפטיבי הוא כיוון, לא פתרון.</b> הוא הפחית הסכמה עיוורת כשהמודל לא היה בטוח, אבל לא שיפר את הדיוק הסופי באופן מובהק.</p>
  </div>
  <p class="small muted">משימת הגיוס לא הייתה במאמר. הוספנו אותה כדי לבדוק אם אותם דפוסים מופיעים גם בהחלטה ארגונית עם השלכות על אנשים.</p>

  <h2>לדיון בכיתה</h2>
  <ol class="q">
    <li>את דניאל מרווין המליץ לקבל בביטחון של 91%, וסימן רק את היתרונות שלו. כמה מכם קיבלו אותו? מה זה אומר על הסבר אדפטיבי שנשען על רמת הביטחון של המודל?</li>
    <li>את רונית מרווין המליץ לדחות, ובין השאר סימן את הפער בקורות החיים, שאינו דרישה. מה קורה כשמערכת גיוס לומדת מהחלטות עבר, ומי בארגון אחראי לבדוק אותה?</li>
    <li>בניסוי המקורי בחרו בכוונה משימות שבהן האדם וה־AI מדויקים באותה מידה. למה זה תנאי הכרחי לביצועים משלימים, ואיפה בארגון שלכם הוא מתקיים?</li>
    <li>אם הסבר מגדיל אמון ולא דיוק, מה צריך להופיע במסך של מי שמקבל החלטה בסיוע AI?</li>
  </ol>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">
    <button class="ghost" id="again">לשחק שוב בקבוצה אחרת</button>
  </div>`;
  document.getElementById("send").onclick = async e=>{
    const btn = e.target, msg = document.getElementById("sendmsg");
    if (S.sent) return;
    btn.disabled = true; btn.textContent = "שולח...";
    try{
      // בקשה פשוטה בלי קריאת התשובה: Apps Script לא מחזיר כותרות CORS
      await fetch(SHEET_URL, {method:"POST", mode:"no-cors", body:new URLSearchParams({code})});
      S.sent = true; btn.textContent = "התוצאה נשלחה";
      msg.textContent = "תודה. אפשר להניח את הטלפון.";
    }catch(err){
      btn.disabled = false; btn.textContent = "לנסות לשלוח שוב";
      msg.textContent = "השליחה לא הצליחה. בדקו את החיבור לרשת, או העתיקו את הקוד והדביקו אותו בקבוצת הקורס.";
    }
  };
  document.getElementById("copy").onclick = async e=>{
    try{ await navigator.clipboard.writeText(code); e.target.textContent="הקוד הועתק"; }
    catch(err){ const r=document.createRange(); r.selectNodeContents(document.getElementById("code")); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); e.target.textContent="הקוד מסומן, העתיקו אותו ידנית"; }
  };
  document.getElementById("again").onclick = ()=>{
    const keys = Object.keys(CONDS);
    S = fresh(keys[(keys.indexOf(S.cond)+1)%keys.length]); S.stage="play"; render();
  };
}

render();
</script>
